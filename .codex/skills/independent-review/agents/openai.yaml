interface:
  display_name: "Independent review"
  short_description: "A reviewer of another model family reviews your work on the pinned schedule."
  default_prompt: "Check .conclave/reviewers.toml for the route and schedule, then run scripts/review-dispatch.py with --writer codex. If the pin has no codex route the dispatcher refuses: hand the change to an agent the pin routes rather than shipping it unreviewed."
